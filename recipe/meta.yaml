{% set name = "pydantic-numpy" %}
{% set version = "9.1.0" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/pydantic_numpy-{{ version }}.tar.gz
  sha256: e6ddb1a13ec72490bfa34ea64979221631f11914563b97e285d3e884f0bd9b78
  patches:
    - 00-dep-ruamel-yaml.patch

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - uv-build >=0.8.14,<0.9.0
  run:
    - python >={{ python_min }},<3.15
    - compress-pickle
    - lz4
    - ruamel.yaml >=0.18.5,<0.19.0
    - numpy >=2.3.5,<3
    - pydantic >=2.12.5,<2.13.0
    - semver >=3.0.4,<4.0.0

test:
  imports:
    - pydantic_numpy
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/caniko/pydantic-numpy
  summary: Pydantic Model integration of the NumPy array
  license: BSD-3-Clause
  license_file: LICENSE
  dev_url: https://github.com/caniko/pydantic-numpy

extra:
  recipe-maintainers:
    - tacaswell
    - caniko
    - apcamargo
